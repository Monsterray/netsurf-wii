name: Wii Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wii-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NetSurf Wii
    runs-on: ubuntu-24.04
    container: devkitpro/devkitppc:latest
    timeout-minutes: 90
    strategy:
      matrix:
        agent: [0, 1]
    env:
      HBC_AGENT: ${{ matrix.agent }}
      HBC_AGENT_ROOT: ${{ github.workspace }}/wii/.deps/hbc-reborn
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Read reviewed HBC revision
        if: matrix.agent == 1
        run: |
          . wii/hbc-reborn.env
          echo "HBC_REBORN_COMMIT=$HBC_REBORN_COMMIT" >> "$GITHUB_ENV"

      - name: Check out HBC-Reborn SDK
        if: matrix.agent == 1
        uses: actions/checkout@v6
        with:
          repository: Monsterray/hbc-reborn
          ref: ${{ env.HBC_REBORN_COMMIT }}
          path: wii/.deps/hbc-reborn

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bison flex fonts-dejavu-core gperf libpng-dev perl python3
          rm -rf /var/lib/apt/lists/*

      - name: Update official Wii SDK packages
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm \
            wii-dev wii-sdl ppc-zlib ppc-libpng ppc-libjpeg-turbo \
            ppc-libwebp ppc-freetype ppc-libexpat

      - name: Run behavioral regressions
        run: |
          python3 wii/test-regressions.py
          python3 wii/test-hbc.py

      - name: Verify current Wii toolchain
        run: |
          ./wii/check-toolchain.sh
          dkp-pacman -Q \
            wii-sdl ppc-zlib ppc-libpng ppc-libjpeg-turbo \
            ppc-libwebp ppc-freetype ppc-libexpat

      - name: Prepare CI fonts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-fonts"
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            "$GITHUB_WORKSPACE/.ci-fonts/Regular.ttf"
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            "$GITHUB_WORKSPACE/.ci-fonts/Bold.ttf"

      - name: Bootstrap Wii dependencies
        run: ./wii/bootstrap-browser-deps.sh

      - name: Verify Wii blitters
        run: |
          ./wii/test-render.sh
          python3 wii/test-presentation.py
          python3 wii/test-agent.py
          python3 wii/test-javascript.py
          python3 wii/test-sites.py
          python3 wii/test-request-filter.py

      - name: Build Wii package
        env:
          RODIN_REGULAR_SOURCE: ${{ github.workspace }}/.ci-fonts/Regular.ttf
          RODIN_BOLD_SOURCE: ${{ github.workspace }}/.ci-fonts/Bold.ttf
        run: ./wii/build-browser.sh -j"$(nproc)"

      - name: Verify package
        run: |
          test -s wii/dist/apps/netsurf/boot.dol
          grep -Fq '<coder>quatric</coder>' wii/dist/apps/netsurf/meta.xml
          "$DEVKITPPC/bin/powerpc-eabi-nm" nsfb | grep -Fq WUPC_Init
          # WPAD_Data, not WPAD_IR: SDL-wii's own event pump reads channel
          # zero's IR position and A/B state directly out of the WPADData
          # struct, so it never calls WPAD_IR(), and neither does our libnsfb
          # patch now that it no longer duplicates SDL's channel zero
          # handling. WPAD_Data is what actually proves IR support is linked.
          "$DEVKITPPC/bin/powerpc-eabi-nm" nsfb | grep -Fq WPAD_Data
          "$DEVKITPPC/bin/powerpc-eabi-nm" nsfb | grep -Fq WPAD_ScanPads
          if strings wii/dist/apps/netsurf/boot.dol | \
              grep -Eiq '/home/runner|/github/workspace'; then
            echo "Unexpected build provenance in boot.dol" >&2
            exit 1
          fi

      - name: Archive package
        run: |
          tar -C wii/dist/apps -czf netsurf-wii-ci.tar.gz netsurf
          sha256sum netsurf-wii-ci.tar.gz > netsurf-wii-ci.tar.gz.sha256

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: netsurf-wii-agent-${{ matrix.agent }}-${{ github.sha }}
          path: |
            netsurf-wii-ci.tar.gz
            netsurf-wii-ci.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
