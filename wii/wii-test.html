<!doctype html>
<html>
<head>
<meta charset="utf-8"><title id="js-title">NetSurf Wii regression</title>

<style>
body{background:#fff;color:#000;font-family:sans-serif}
.tiles{width:220px;height:64px;background:url(wii-test.png) repeat}
.box{display:inline-block;width:64px;height:48px;margin:4px}
.red{background:#f00}
.green{background:#0f0}
.blue{background:#00f}
</style>
<script>
"use strict";
var wiiShared = 42;
function wiiSharedFunction()
{
    return wiiShared;
}
</script>
<script>
if (wiiSharedFunction() !== 42)
    throw new Error("strict page globals lost");
</script>
</head>

<body>
<h1>NetSurf Wii regression</h1>

<p>Red, green, blue, a decoded image, and tiled image:</p>
<div class="box red"></div>
<div class="box green"></div>
<div class="box blue"></div>
<p><img src="wii-test.png" width="128" height="64"></p>
<div class="tiles"></div>
<div id="geometry" style="width:100px;height:30px;padding:5px;border:2px solid black"></div>
<p>PDF export and download smoke check.</p>
<script>

if (navigator.cookieEnabled !== true)
    throw new Error("cookie capability disagrees with cookie support");
if (screen !== window.screen || screen.width !== 640 || screen.height !== 480 ||
    screen.availWidth !== 640 || screen.availHeight !== 480 ||
    screen.colorDepth !== screen.pixelDepth ||
    (screen.colorDepth !== 24 && screen.colorDepth !== 16))
    throw new Error("screen does not report the Wii display");
screen.width = 1;
if (screen.width !== 640)
    throw new Error("screen width is writable");

var ancestor = document.createElement("div"),
    target = document.createElement("div"), count = 0, ancestors = 0;
ancestor.appendChild(target);
function callback()
{
    count++;
}
function fire(bubbles)
{
    var event = document.createEvent("Event");
    event.initEvent("probe", bubbles, false);
    target.dispatchEvent(event);
}
ancestor.addEventListener("probe", function() { ancestors++; }, false);
target.addEventListener("probe", callback, { capture : false, passive : true });
target.addEventListener("probe", callback, { capture : false });
fire(false);
if (count !== 1 || ancestors !== 0)
    throw new Error("initial listener counts=" + count + "," + ancestors);
target.removeEventListener("probe", callback, { capture : false });
fire(false);
if (count !== 1)
    throw new Error("removed listener fired");
target.addEventListener("probe", callback, false);
fire(true);
if (count !== 2 || ancestors !== 1)
    throw new Error("bubbling listener counts=" + count + "," + ancestors);
var input = document.createElement("input");
if ("validity" in input || "checkValidity" in input)
    throw new Error("unimplemented validation is exposed");
if (typeof input.setAttribute !== "function" || !("value" in input))
    throw new Error("implemented input APIs were removed");
var detached = document.createElement("div").getBoundingClientRect();
if (detached.width !== 0 || detached.height !== 0)
    throw new Error("detached rectangle is not empty");
var wiiEmptyExecuted = false, wiiModuleExecuted = false, wiiDataExecuted = false;
function scriptProbe(type, flag) {
    var script = document.createElement("script");
    script.type = type;
    script.src = "data:text/javascript,window." + flag + "=true";
    document.body.appendChild(script);
}
scriptProbe("", "wiiEmptyExecuted");
scriptProbe("module", "wiiModuleExecuted");
scriptProbe("application/json", "wiiDataExecuted");
var imageLoaded = false, imageFailed = false, staleImageEvent = false;
var image = new Image(7, 9), badImage = new Image(), replacedImage = new Image();
if (!(image instanceof HTMLImageElement) || !(image instanceof Image) ||
    image.width !== 7 || image.height !== 9 || !image.complete)
    throw new Error("Image constructor failed");
image.onload = function () {
    imageLoaded = this === image && image.naturalWidth === 16 &&
        image.naturalHeight === 8 && image.complete;
};
image.src = "wii-test.png";
badImage.onerror = function () { imageFailed = badImage.complete; };
badImage.setAttribute("src", "data:image/x-unsupported;base64,AA==");
replacedImage.onerror = function () { staleImageEvent = true; };
replacedImage.src = "data:image/x-unsupported;base64,AA==";
replacedImage.src = "wii-test.png";
var liveBox = document.createElement("div"), hiddenBox = document.createElement("div");
liveBox.dataset.userId = "42";
if (liveBox.dataset !== liveBox.dataset || liveBox.getAttribute("data-user-id") !== "42")
    throw new Error("dataset write did not reach DOM");
liveBox.setAttribute("data-user-id", "43");
if (liveBox.dataset.userId !== "43" || Object.keys(liveBox.dataset).join() !== "userId")
    throw new Error("dataset is not live");
delete liveBox.dataset.userId;
if (liveBox.hasAttribute("data-user-id") || "userId" in liveBox.dataset)
    throw new Error("dataset deletion failed");
setTimeout(function () {
    liveBox.setAttribute("style", "display:none; width:73px; height:21px; background-color:lime");
    liveBox.appendChild(document.createTextNode("LIVE LAYOUT PASS"));
    document.body.appendChild(liveBox);
    hiddenBox.setAttribute("style", "width:39px; height:18px");
    hiddenBox.hidden = true;
    if (!hiddenBox.hasAttribute("hidden") || !hiddenBox.hidden)
        throw new Error("hidden attribute reflection failed");
    document.body.appendChild(hiddenBox);
    liveBox.style.display = "block";
    liveBox.style.visibility = "visible";
    if (liveBox.style !== liveBox.style ||
        liveBox.getAttribute("style").indexOf("display: block") < 0)
        throw new Error("style is not backed by its element");
    if (document.compatMode !== "CSS1Compat")
        throw new Error("wrong document compatibility mode");
    var list = liveBox.childNodes;
    if (list[0] !== liveBox.firstChild || list[list.length] !== undefined)
        throw new Error("collection indexing failed");
}, 1000);
setTimeout(function () {
    if (!wiiEmptyExecuted || wiiModuleExecuted || wiiDataExecuted)
        throw new Error("script types were not respected");
    if (!imageLoaded || !imageFailed || staleImageEvent)
        throw new Error("detached image events wrong: " + imageLoaded + "," + imageFailed + "," + staleImageEvent);
    var r = document.getElementById("geometry").getBoundingClientRect();
    if (r.width !== 114 || r.height !== 44 ||
        r.right - r.left !== r.width || r.bottom - r.top !== r.height)
        throw new Error("border rectangle wrong: " + r.width + "x" + r.height);
    r.width = -10;
    if (r.left !== r.x - 10 || r.right !== r.x)
        throw new Error("negative rectangle edges wrong");
    var liveRect = liveBox.getBoundingClientRect();
    if (liveRect.width !== 73 || liveRect.height !== 21)
        throw new Error("newly inserted box was not laid out: " + liveRect.width + "x" + liveRect.height);
    var hiddenRect = hiddenBox.getBoundingClientRect();
    if (hiddenRect.width !== 0 || hiddenRect.height !== 0)
        throw new Error("hidden element was rendered");
    hiddenBox.hidden = false;
    setTimeout(function () {
        var shownRect = hiddenBox.getBoundingClientRect();
        if (shownRect.width !== 39 || shownRect.height !== 18)
            throw new Error("unhidden element was not laid out");
        document.body.removeChild(hiddenBox);
        document.body.removeChild(liveBox);
        setTimeout(function () {
            var removedRect = liveBox.getBoundingClientRect();
            if (removedRect.width !== 0 || removedRect.height !== 0)
                throw new Error("removed node retained a stale box");
            document.title = "NetSurf Wii JavaScript PASS";
        }, 1000);
    }, 1000);
    document.title = "NetSurf Wii JavaScript checking removal";
    if (document.title !== "NetSurf Wii JavaScript checking removal")
        throw new Error("title getter failed");
}, 3000);
</script>
</body>
</html>
